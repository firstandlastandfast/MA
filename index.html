<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calorie Snap</title>
<style>
:root{--bg:#f2f5f3;--ink:#14201b;--mute:#5f6f67;--card:#fff;--line:#d9e2dd;--accent:#1f6f54;--on:#fff;--warn:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101714;--ink:#e8f0ec;--mute:#93a39b;--card:#18221d;--line:#2a3a33;--accent:#4cc39a;--on:#06251a;--warn:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 16px calc(24px + env(safe-area-inset-bottom,0))}
main{max-width:480px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px}
.top h1{font-size:18px;margin:0;font-weight:650}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mute)}
.total{padding:18px 0 8px}
.total .num{font-size:64px;line-height:1;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.total .unit{font-size:18px;color:var(--mute);margin-left:6px;letter-spacing:0;font-weight:500}
.total .sub{color:var(--mute);margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar.over i{background:var(--warn)}
.snap{display:block;width:100%;margin:20px 0 8px;padding:18px;border:0;border-radius:18px;background:var(--accent);color:var(--on);font-size:19px;font-weight:650;text-align:center}
.link{background:none;border:0;color:var(--accent);padding:8px 0;font-weight:600}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.msg.err{border-color:var(--warn);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.row{display:grid;grid-template-columns:1fr 64px 64px 28px;gap:6px;margin-bottom:6px;align-items:center}
.row.head{color:var(--mute);font-size:13px;margin-bottom:2px}
.row input{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row .x{background:none;border:0;color:var(--mute);font-size:20px;padding:0}
.draft-total{display:flex;justify-content:space-between;font-weight:650;margin:10px 0}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:none}
.btns .primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:650}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.meal{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .info{flex:1;min-width:0}
.meal .names{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .time{color:var(--mute);font-size:13px}
.meal .kcal{font-weight:650;font-variant-numeric:tabular-nums}
.meal .del{background:none;border:0;color:var(--mute);font-size:18px}
.hist{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
label.f{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
.f+input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.empty{color:var(--mute);padding:6px 0}
.busy{display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Calorie Snap</h1><button class="icon-btn" id="settingsBtn">Settings</button></div>

  <section class="total" aria-live="polite">
    <div><span class="num" id="todayNum">0</span><span class="unit">kcal today</span></div>
    <div class="sub" id="todaySub"></div>
    <div class="bar" id="bar"><i></i></div>
  </section>

  <button class="snap" id="snapBtn">Snap a meal</button>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
  <button class="link" id="typeBtn">Add a meal without a photo</button>

  <div id="status"></div>
  <div id="draft"></div>

  <section class="card" id="settings" hidden>
    <h2>Settings</h2>
    <label class="f" for="key">Gemini API key</label>
    <input id="key" type="password" autocomplete="off">
    <label class="f" for="model">Model</label>
    <input id="model" autocomplete="off">
    <label class="f" for="goal">Daily goal (kcal)</label>
    <input id="goal" type="number" inputmode="numeric">
    <div class="btns" style="margin-top:14px"><button class="primary" id="saveSettings">Save settings</button></div>
  </section>

  <section class="card">
    <h2>Today’s meals</h2>
    <div id="log"></div>
  </section>

  <section class="card">
    <h2>Past days</h2>
    <div id="history"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch { show('Storage is full. Delete some old meals.', true); } } };

let meals = LS.get('cs_meals', []);
let cfg = Object.assign({ key: '', model: 'gemini-2.5-flash', goal: 2000 }, LS.get('cs_cfg', {}));
let draft = null; // { items:[{name,grams,kcal,kpg}], thumb }

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const sum = items => Math.round(items.reduce((a, i) => a + (+i.kcal || 0), 0));

function show(text, isErr){ $('status').innerHTML = text ? `<div class="msg ${isErr ? 'err' : ''}">${esc(text)}</div>` : ''; }
function busy(text){ $('status').innerHTML = `<div class="msg busy"><div class="spin"></div>${esc(text)}</div>`; }

/* ---------- Today total + Meal log + Past days ---------- */
function render(){
  const today = dayKey(Date.now());
  const todays = meals.filter(m => m.day === today).sort((a,b) => b.ts - a.ts);
  const total = todays.reduce((a, m) => a + m.kcal, 0);
  $('todayNum').textContent = total.toLocaleString();
  const goal = +cfg.goal || 0;
  $('todaySub').textContent = goal ? (total <= goal ? `${(goal-total).toLocaleString()} left of ${goal.toLocaleString()}` : `${(total-goal).toLocaleString()} over ${goal.toLocaleString()}`) : '';
  $('bar').hidden = !goal;
  $('bar').className = 'bar' + (total > goal ? ' over' : '');
  $('bar').firstElementChild.style.width = goal ? Math.min(100, total / goal * 100) + '%' : '0';

  $('log').innerHTML = todays.length ? todays.map(m => `
    <div class="meal">
      <img class="thumb" alt="" src="${m.thumb || ''}">
      <div class="info"><div class="names">${esc(m.items.map(i => i.name).join(', ') || 'Meal')}</div>
      <div class="time">${new Date(m.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</div></div>
      <div class="kcal">${m.kcal}</div>
      <button class="del" data-id="${m.id}" aria-label="Delete meal">✕</button>
    </div>`).join('') : '<div class="empty">No meals yet. Tap “Snap a meal”.</div>';

  const byDay = {};
  meals.forEach(m => { if (m.day !== today) byDay[m.day] = (byDay[m.day] || 0) + m.kcal; });
  const days = Object.keys(byDay).sort().reverse().slice(0, 7);
  $('history').innerHTML = days.length ? days.map(d => `<div class="hist"><span>${new Date(d + 'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})}</span><b>${byDay[d].toLocaleString()} kcal</b></div>`).join('') : '<div class="empty">Earlier days will show up here.</div>';
}

$('log').addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (id && confirm('Delete this meal?')) { meals = meals.filter(m => String(m.id) !== id); LS.set('cs_meals', meals); render(); }
});

/* ---------- Meal card (editable result) ---------- */
function renderDraft(){
  if (!draft) { $('draft').innerHTML = ''; return; }
  $('draft').innerHTML = `
  <div class="card">
    <h2>Check this meal</h2>
    <div class="row head"><span>Food</span><span>Grams</span><span>kcal</span><span></span></div>
    ${draft.items.map((it, n) => `
    <div class="row">
      <input data-n="${n}" data-f="name" value="${esc(it.name)}" aria-label="Food name">
      <input data-n="${n}" data-f="grams" type="number" inputmode="decimal" value="${it.grams}" aria-label="Grams">
      <input data-n="${n}" data-f="kcal" type="number" inputmode="decimal" value="${it.kcal}" aria-label="Calories">
      <button class="x" data-rm="${n}" aria-label="Remove item">×</button>
    </div>`).join('')}
    <button class="link" id="addItem">Add item</button>
    <div class="draft-total"><span>Total</span><span id="draftTotal">${sum(draft.items)} kcal</span></div>
    <div class="btns"><button id="discard">Discard</button><button class="primary" id="saveMeal">Save meal</button></div>
  </div>`;
}

$('draft').addEventListener('input', e => {
  const t = e.target, n = t.dataset.n, f = t.dataset.f;
  if (n === undefined || !draft) return;
  const it = draft.items[n];
  if (f === 'name') it.name = t.value;
  if (f === 'grams') {
    it.grams = +t.value || 0;
    if (it.kpg) { it.kcal = Math.round(it.kpg * it.grams); t.parentElement.querySelector('[data-f=kcal]').value = it.kcal; }
  }
  if (f === 'kcal') { it.kcal = +t.value || 0; if (it.grams) it.kpg = it.kcal / it.grams; }
  $('draftTotal').textContent = sum(draft.items) + ' kcal';
});

$('draft').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.rm !== undefined) { draft.items.splice(+t.dataset.rm, 1); renderDraft(); }
  else if (t.id === 'addItem') { draft.items.push({ name: '', grams: 0, kcal: 0 }); renderDraft(); }
  else if (t.id === 'discard') { draft = null; renderDraft(); show(''); }
  else if (t.id === 'saveMeal') {
    const items = draft.items.filter(i => i.name.trim() || i.kcal);
    if (!items.length) { show('Add at least one food before saving.', true); return; }
    const now = Date.now();
    meals.push({ id: now, ts: now, day: dayKey(now), items: items.map(({name, grams, kcal}) => ({name, grams, kcal})), kcal: sum(items), thumb: draft.thumb || '' });
    LS.set('cs_meals', meals);
    draft = null; renderDraft(); show(''); render();
  }
});

/* ---------- Snap a meal ---------- */
$('snapBtn').onclick = () => {
  if (!cfg.key) { $('settings').hidden = false; show('Add your Gemini API key in Settings first.', true); $('key').focus(); return; }
  $('file').click();
};
$('typeBtn').onclick = () => { draft = { items: [{ name: '', grams: 0, kcal: 0 }], thumb: '' }; show(''); renderDraft(); };

$('file').onchange = async () => {
  const f = $('file').files[0]; $('file').value = '';
  if (!f) return;
  try {
    busy('Reading your photo…');
    const { full, thumb } = await shrink(f);
    busy('Estimating calories…');
    const items = await analyze(full);
    draft = { items: items.map(i => ({ ...i, kpg: i.grams ? i.kcal / i.grams : 0 })), thumb };
    show(items.length ? '' : 'No food found. Add items by hand.', !items.length);
    if (!items.length) draft.items.push({ name: '', grams: 0, kcal: 0 });
    renderDraft();
  } catch (err) { show(err.message || 'Something went wrong. Try again.', true); }
};

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = max => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', max > 200 ? 0.8 : 0.6); };
      const out = { full: draw(1024), thumb: draw(120) }; URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => rej(new Error('Could not read that photo.'));
    img.src = url;
  });
}

async function analyze(dataUrl){
  const body = {
    contents: [{ parts: [
      { text: 'Identify each distinct food or drink in this photo. For each, estimate the portion in grams (ml for drinks) and the calories, including likely cooking oil, butter or sauce. Use short plain names. Return JSON only.' },
      { inline_data: { mime_type: 'image/jpeg', data: dataUrl.split(',')[1] } }
    ] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: { type: 'OBJECT', properties: { items: { type: 'ARRAY', items: { type: 'OBJECT', properties: { name: { type: 'STRING' }, grams: { type: 'NUMBER' }, kcal: { type: 'NUMBER' } }, required: ['name', 'grams', 'kcal'] } } }, required: ['items'] } }
  };
  let r;
  try {
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.key }, body: JSON.stringify(body) });
  } catch { throw new Error('No connection. Check your internet and try again.'); }
  if (r.status === 429) throw new Error('Free limit reached. Wait a minute, or try again tomorrow.');
  if (r.status === 400 || r.status === 403) throw new Error('Gemini did not accept the key or model. Check Settings.');
  if (!r.ok) throw new Error('Gemini had a problem (' + r.status + '). Try again shortly.');
  const data = await r.json();
  try {
    const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
    return (parsed.items || []).map(i => ({ name: String(i.name || ''), grams: Math.round(+i.grams || 0), kcal: Math.round(+i.kcal || 0) }));
  } catch { throw new Error('Could not read the estimate. Try another photo.'); }
}

/* ---------- Settings ---------- */
$('settingsBtn').onclick = () => { $('key').value = cfg.key; $('model').value = cfg.model; $('goal').value = cfg.goal; $('settings').hidden = !$('settings').hidden; };
$('saveSettings').onclick = () => {
  cfg = { key: $('key').value.trim(), model: $('model').value.trim() || 'gemini-2.5-flash', goal: +$('goal').value || 0 };
  LS.set('cs_cfg', cfg); $('settings').hidden = true; show('Settings saved.'); render();
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
